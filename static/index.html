<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>terminalIA</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
  :root{
    /* tokens nativos do OpenHands Agent Canvas */
    --oh-color-base:#0B0E14;
    --oh-color-base-secondary:#21252F;
    --oh-surface-raised:#2C313F;
    --oh-contrast:#FFFFFF;
    --oh-foreground:#EEF2F7;
    --oh-muted:#A3B0C4;
    --oh-text-dim:#7E8A9E;
    --oh-border:#4B5468;
    --oh-border-subtle:#383F50;
    --oh-color-primary:#C9B974;
    --oh-accent-foreground:#0B0E14;
    --oh-danger:#E76A5E;
    --oh-success:#A5E75E;
    --radius:8px;
    --radius-lg:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--oh-color-base);
    color:var(--oh-foreground);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,"Courier New",monospace}
  button,input,textarea{font:inherit}

  #app{display:flex; flex-direction:column; height:100dvh}

  header{
    display:flex; align-items:center; gap:10px;
    padding:10px 16px; border-bottom:1px solid var(--oh-border-subtle);
    background:var(--oh-color-base);
  }
  .brand{font-weight:600; letter-spacing:-.01em; color:var(--oh-contrast)}
  .brand .sub{color:var(--oh-text-dim); font-weight:400; margin-left:6px; font-size:12px}
  .status{margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12px; color:var(--oh-muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--oh-text-dim)}
  .dot.ok{background:var(--oh-success)}
  .dot.down{background:var(--oh-danger)}

  #stream{flex:1; min-height:0; overflow-y:auto; padding:20px 16px 8px}
  .wrap{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:16px}

  .msg{display:flex; flex-direction:column; gap:6px; max-width:100%}
  .who{font-size:12px; color:var(--oh-text-dim); font-weight:500}
  .body{
    border:1px solid var(--oh-border-subtle); border-radius:var(--radius-lg);
    background:var(--oh-color-base-secondary); padding:12px 14px;
    white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
  }
  .msg.user{align-items:flex-end}
  .msg.user .body{background:var(--oh-surface-raised); border-color:var(--oh-border)}
  .msg.err .body{border-color:var(--oh-danger); color:#f3b4ad}
  .msg.sys{align-items:center; text-align:center}
  .msg.sys .body{background:transparent; border-style:dashed; color:var(--oh-text-dim); font-size:12.5px}

  .step{border:1px solid var(--oh-border-subtle); border-radius:var(--radius-lg); overflow:hidden; background:var(--oh-color-base)}
  .step-head{
    display:flex; align-items:center; gap:8px; padding:7px 12px;
    background:var(--oh-color-base-secondary); border-bottom:1px solid var(--oh-border-subtle);
    font-size:12px; color:var(--oh-muted);
  }
  .step-head .tool{color:var(--oh-contrast); font-weight:500}
  .step-head .badge{margin-left:auto; font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid var(--oh-border)}
  .badge.ok{color:var(--oh-success); border-color:rgba(165,231,94,.4)}
  .badge.fail{color:var(--oh-danger); border-color:rgba(231,106,94,.45)}
  .step pre{
    margin:0; padding:10px 12px; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12.5px; color:var(--oh-foreground);
  }
  .step .out{border-top:1px solid var(--oh-border-subtle); color:var(--oh-muted)}
  .step .out.err{color:#f3b4ad}

  .composer{border-top:1px solid var(--oh-border-subtle); background:var(--oh-color-base); padding:12px 16px 16px}
  .composer .inner{max-width:760px; margin:0 auto; display:flex; gap:8px; align-items:flex-end}
  .field{
    flex:1; min-width:0; resize:none; min-height:44px; max-height:160px; padding:11px 12px;
    background:var(--oh-color-base-secondary); color:var(--oh-contrast);
    border:1px solid var(--oh-border); border-radius:var(--radius); outline:none;
  }
  .field::placeholder{color:var(--oh-text-dim)}
  .field:focus{border-color:rgba(255,255,255,.4); box-shadow:0 0 0 1px rgba(255,255,255,.2)}
  .btn{
    height:44px; padding:0 16px; border:0; border-radius:var(--radius); cursor:pointer;
    background:var(--oh-color-primary); color:var(--oh-accent-foreground); font-weight:500;
    transition:opacity .075s; white-space:nowrap;
  }
  .btn:hover{opacity:.8}
  .btn:disabled{cursor:not-allowed; opacity:.3}
  .hint{max-width:760px; margin:8px auto 0; font-size:11.5px; color:var(--oh-text-dim); text-align:center}

  #login{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
         background:var(--oh-color-base); padding:20px}
  #login.hidden{display:none}
  .card{
    width:min(100%,380px); border:1px solid var(--oh-border); border-radius:var(--radius-lg);
    background:var(--oh-color-base-secondary); padding:24px;
  }
  .card h1{margin:0; font-size:18px; font-weight:600; color:var(--oh-contrast); letter-spacing:-.01em}
  .card p{margin:6px 0 20px; font-size:13px; color:var(--oh-muted)}
  .card label{display:block; font-size:12px; color:var(--oh-muted); margin:0 0 6px}
  .card input{
    width:100%; height:40px; padding:0 12px; margin-bottom:14px;
    background:var(--oh-color-base); color:var(--oh-contrast);
    border:1px solid var(--oh-border); border-radius:var(--radius); outline:none;
  }
  .card input:focus{border-color:rgba(255,255,255,.4); box-shadow:0 0 0 1px rgba(255,255,255,.2)}
  .card .btn{width:100%; height:40px}
  .card .err{min-height:18px; margin-top:10px; font-size:12.5px; color:var(--oh-danger)}

  @media (max-width:600px){
    #stream{padding:16px 12px 4px}
    .composer{padding:10px 12px 14px}
    .body{padding:11px 12px}
  }
</style>
</head>
<body>
<div id="login">
  <form class="card" id="login-form" autocomplete="off">
    <h1>terminalIA</h1>
    <p>Entre para conversar com o agente local.</p>
    <label for="lg-user">Usuário</label>
    <input id="lg-user" name="username" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label for="lg-pass">Senha</label>
    <input id="lg-pass" name="password" type="password" autocomplete="current-password">
    <button class="btn" type="submit">Entrar</button>
    <div class="err" id="lg-err"></div>
  </form>
</div>

<div id="app">
  <header>
    <div class="brand">terminalIA<span class="sub">agente local</span></div>
    <div class="status"><span class="dot" id="model-dot"></span><span id="model-txt">verificando…</span></div>
  </header>

  <main id="stream">
    <div class="wrap" id="stream-wrap"></div>
  </main>

  <form class="composer" id="composer">
    <div class="inner">
      <textarea class="field" id="chat-input" rows="1" placeholder="Envie uma mensagem…"></textarea>
      <button class="btn" id="send" type="submit">Enviar</button>
    </div>
    <div class="hint">modelo local via llama.cpp · o agente executa código, instala pacotes e manipula arquivos</div>
  </form>
</div>

<script>
(function(){
  "use strict";

  // ---------------- Autenticação ----------------
  let AUTH = sessionStorage.getItem("tia_auth") || "";

  function b64url(str){
    return btoa(unescape(encodeURIComponent(str)))
      .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  function authHeaders(){ return AUTH ? {"Authorization":"Basic " + AUTH} : {}; }
  function showLogin(msg){
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("lg-err").textContent = msg || "";
  }
  function hideLogin(){ document.getElementById("login").classList.add("hidden"); }

  document.getElementById("login-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const u = document.getElementById("lg-user").value.trim();
    const p = document.getElementById("lg-pass").value;
    if(!u){ document.getElementById("lg-err").textContent = "Informe o usuário."; return; }
    const token = b64url(u + ":" + p);
    try{
      const r = await fetch("/api/health", {headers:{"Authorization":"Basic " + token}, cache:"no-store"});
      if(r.status === 401){ document.getElementById("lg-err").textContent = "Usuário ou senha inválidos."; return; }
      if(!r.ok){ document.getElementById("lg-err").textContent = "Falha ao conectar (" + r.status + ")."; return; }
    }catch(err){ document.getElementById("lg-err").textContent = "Erro de rede: " + err.message; return; }
    AUTH = token; sessionStorage.setItem("tia_auth", AUTH);
    document.getElementById("lg-pass").value = "";
    hideLogin(); boot();
  });

  let booted = false;
  function boot(){
    if(booted) return; booted = true;

    const wrap = document.getElementById("stream-wrap");
    const stream = document.getElementById("stream");
    const input = document.getElementById("chat-input");
    const send = document.getElementById("send");
    const composer = document.getElementById("composer");
    const history = [];

    // ---------------- Status do modelo ----------------
    const dot = document.getElementById("model-dot");
    const modelTxt = document.getElementById("model-txt");
    async function pollHealth(){
      try{
        const r = await fetch("/api/health", {headers:authHeaders(), cache:"no-store"});
        if(r.status === 401){ dot.className="dot down"; modelTxt.textContent="sessão expirada"; showLogin("Sessão expirada. Entre novamente."); return; }
        const d = await r.json();
        if(d.model === "ok"){ dot.className="dot ok"; modelTxt.textContent="modelo online"; }
        else { dot.className="dot"; modelTxt.textContent="carregando modelo…"; }
      }catch(e){ dot.className="dot down"; modelTxt.textContent="offline"; }
    }
    pollHealth(); setInterval(pollHealth, 5000);

    // ---------------- Renderização ----------------
    function message(role, label, text){
      const msg = document.createElement("div");
      msg.className = "msg " + role;
      if(label){
        const who = document.createElement("div");
        who.className = "who"; who.textContent = label;
        msg.appendChild(who);
      }
      const body = document.createElement("div");
      body.className = "body"; body.textContent = text;
      msg.appendChild(body);
      wrap.appendChild(msg);
      stream.scrollTop = stream.scrollHeight;
      return msg;
    }

    // Bloco de uma ferramenta executada pelo agente, com a saída real.
    function stepNode(step){
      const box = document.createElement("div");
      box.className = "step";
      const head = document.createElement("div");
      head.className = "step-head";
      const tool = document.createElement("span");
      tool.className = "tool mono";
      tool.textContent = step.kind && step.kind !== "run" ? step.kind : step.lang;
      const badge = document.createElement("span");
      const ok = step.exit_code === 0 && !step.timed_out;
      badge.className = "badge " + (ok ? "ok" : "fail");
      badge.textContent = step.timed_out ? "timeout" : ("exit " + step.exit_code);
      head.append(tool, badge);
      const pre = document.createElement("pre");
      pre.textContent = step.code || "";
      box.append(head, pre);
      if(step.stdout){
        const o = document.createElement("pre");
        o.className = "out"; o.textContent = step.stdout.replace(/\n$/,"");
        box.appendChild(o);
      }
      if(step.stderr){
        const er = document.createElement("pre");
        er.className = "out err"; er.textContent = step.stderr.replace(/\n$/,"");
        box.appendChild(er);
      }
      return box;
    }

    message("sys", null, "Conectado. Envie uma mensagem para começar.");

    // ---------------- Envio ----------------
    async function ask(){
      const text = input.value.trim();
      if(!text || send.disabled) return;
      input.value = ""; input.style.height = "auto";
      message("user", "Você", text);
      history.push({role:"user", content:text});
      send.disabled = true; send.textContent = "…";

      const pending = message("assistant", "terminalIA", "Pensando…");
      try{
        const r = await fetch("/api/chat", {
          method:"POST",
          headers: Object.assign({"Content-Type":"application/json"}, authHeaders()),
          body: JSON.stringify({messages: history})
        });
        if(r.status === 401){ showLogin("Sessão expirada. Entre novamente."); throw new Error("não autorizado"); }
        if(!r.ok){ throw new Error("HTTP " + r.status); }
        const d = await r.json();

        pending.remove();
        const msg = document.createElement("div");
        msg.className = "msg assistant";
        const who = document.createElement("div");
        who.className = "who"; who.textContent = "terminalIA";
        msg.appendChild(who);
        (d.steps || []).forEach((s)=>msg.appendChild(stepNode(s)));
        const body = document.createElement("div");
        body.className = "body"; body.textContent = d.reply || "(resposta vazia)";
        msg.appendChild(body);
        wrap.appendChild(msg);

        history.push({role:"assistant", content: d.reply || ""});
      }catch(e){
        pending.remove();
        message("err", "Erro", "Falha ao consultar o agente: " + e.message);
        history.pop();
      }finally{
        send.disabled = false; send.textContent = "Enviar"; input.focus();
        stream.scrollTop = stream.scrollHeight;
      }
    }

    composer.addEventListener("submit", (e)=>{ e.preventDefault(); ask(); });
    input.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(); }
    });
    input.addEventListener("input", ()=>{
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    });
  }

  // ---------------- Inicialização ----------------
  if(AUTH){
    fetch("/api/health", {headers: authHeaders(), cache:"no-store"})
      .then((r)=>{ if(r.ok){ hideLogin(); boot(); } else { sessionStorage.removeItem("tia_auth"); AUTH=""; showLogin(""); } })
      .catch(()=>{ hideLogin(); boot(); });
  } else {
    showLogin("");
  }
})();
</script>
</body>
</html>
